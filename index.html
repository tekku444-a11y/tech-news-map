<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>テックニュース相関図</title>
  <meta name="description" content="テックニュースの相関グラフ（閲覧専用）">
  <meta name="theme-color" content="#0f1419">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="テック相関">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body data-view="overview">
  <header id="hdr">
    <div class="bar">
      <button id="back" class="back" type="button" aria-label="戻る" hidden>‹</button>
      <div class="ttl">
        <nav id="crumb" class="crumb" aria-label="現在地"></nav>
        <h1 id="title">テックニュース相関図</h1>
      </div>
      <span id="updated" class="updated">更新 —</span>
    </div>
    <div class="ctrl">
      <div class="seg" role="group" aria-label="期間">
        <button type="button" data-period="all" aria-pressed="true">全期間</button>
        <button type="button" data-period="2w" aria-pressed="false">直近2週間</button>
      </div>
      <label class="toggle">
        <input type="checkbox" id="weak">
        <span>弱いリンクも</span>
      </label>
    </div>
  </header>

  <main id="graph" aria-label="相関グラフ"></main>
  <div id="hint" class="hint"></div>
  <div id="status" class="status">読み込み中…</div>

  <button id="fit" class="fab" type="button" aria-label="全体を表示">全体表示</button>

  <section id="sheet" class="sheet" aria-hidden="true" role="dialog" aria-label="ニュース詳細">
    <button id="grab" class="grab" type="button" aria-label="詳細の大きさを切り替え"><span class="grabber"></span></button>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <script src="vendor/vis-network.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
