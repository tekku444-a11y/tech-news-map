<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>テックニュース相関図</title>
  <meta name="description" content="テックニュースの相関グラフ（閲覧専用）">
  <meta name="theme-color" content="#0f1419">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="テック相関">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="hdr">
    <div class="hdr-row">
      <h1>テックニュース相関図</h1>
      <span id="updated" class="updated">最終更新: —</span>
    </div>
    <div class="hdr-row sub">
      <div id="legend" class="legend" aria-label="凡例"></div>
      <label class="toggle">
        <input type="checkbox" id="weak">
        <span>弱いリンクも表示</span>
      </label>
    </div>
  </header>

  <main id="graph" aria-label="相関グラフ"></main>
  <div id="status" class="status">読み込み中…</div>

  <button id="fit" class="fab" type="button" aria-label="全体を表示">全体</button>

  <section id="sheet" class="sheet" aria-hidden="true" role="dialog" aria-label="ニュース詳細">
    <div class="grabber" aria-hidden="true"></div>
    <button id="sheet-close" class="sheet-close" type="button" aria-label="閉じる">×</button>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <script src="vendor/vis-network.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
